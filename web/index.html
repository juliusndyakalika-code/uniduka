<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- interactive-widget=resizes-content: when the on-screen keyboard opens,
         shrink the layout viewport rather than sliding a full-height page
         under it. Without it a 100vh shell keeps its height, the browser
         scrolls the focused field into view, and a shell that cannot scroll
         has its children overlap instead. viewport-fit=cover is what makes
         env(safe-area-inset-*) report real values. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#B0682C" />
    <!-- Lets the browser paint its own canvas dark on a dark phone before any
         script has run. Without it a dark-mode owner gets a white flash on
         every load, the moment before the app sets its theme. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MauzoHalisi" />
    <meta name="application-name" content="MauzoHalisi" />
    <meta name="description" content="Taarifa kwa Wakati. Faida Zaidi." />
    <title>MauzoHalisi — Taarifa kwa Wakati. Faida Zaidi.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
