# Security headers, included by every location that sets headers of its own.
#
# nginx's add_header does not merge: a location with any add_header of its own
# discards every header inherited from the server block. Several locations here
# set Cache-Control, so declaring these once at server level would silently
# drop them from exactly the responses that matter. Hence an include, repeated
# where needed, and `always` so they are present on error responses too.

# Clickjacking. The assessment framed the whole app in an iframe; frame-ancestors
# is the modern control and X-Frame-Options covers browsers that predate it.
add_header X-Frame-Options "DENY" always;

# MIME sniffing, which can turn an uploaded file into executable script.
add_header X-Content-Type-Options "nosniff" always;

# Referrer leakage. A full URL can carry shop and record ids to third parties.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing here needs a camera, microphone or geolocation from a third-party
# frame, and the barcode scanner uses the camera from this origin only.
add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

# HSTS. Railway terminates TLS and already redirects, but this stops the first
# request of a session going out in the clear on a hostile network.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content Security Policy.
#
# 'unsafe-inline' is present for styles and not for scripts. The build emits a
# small inline style block and several libraries set element styles directly,
# so removing it breaks the interface; script-src has no such escape, which is
# the half that matters, since it is what stops injected script from running
# and is the compensating control for the tokens the SPA keeps in localStorage.
#
# connect-src carries the API origin because the front end and the API are
# separate hosts, and both https and wss because the realtime channel dials the
# same origin over a WebSocket.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ${API_ORIGIN} ${API_ORIGIN_WS}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:; manifest-src 'self'" always;
