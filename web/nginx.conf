server {
    listen $PORT;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Canonical host. Both mauzohalisi.com and www serve the same app, which
    # splits search ranking and makes shared links inconsistent, so www is sent
    # to the bare domain with a permanent redirect.
    #
    # Done here rather than at DNS on purpose: a Namecheap URL Redirect record
    # is an A record into their own infrastructure, which conflicts with the
    # CNAME Railway needs and serves no certificate for the domain — HTTPS fails
    # before any redirect can happen. Railway terminates TLS for both hosts, so
    # redirecting at the app keeps a valid certificate on the way through.
    #
    # X-Forwarded-Proto, because TLS ends at Railway's edge and this server only
    # ever sees plain HTTP.
    if ($host = "www.mauzohalisi.com") {
        return 301 https://mauzohalisi.com$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
