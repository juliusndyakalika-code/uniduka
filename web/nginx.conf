server {
    listen $PORT;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Canonical host. Both mauzohalisi.com and www serve the same app, which
    # splits search ranking and makes shared links inconsistent, so www is sent
    # to the bare domain with a permanent redirect.
    #
    # Done here rather than at DNS on purpose: a Namecheap URL Redirect record
    # is an A record into their own infrastructure, which conflicts with the
    # CNAME Railway needs and serves no certificate for the domain — HTTPS fails
    # before any redirect can happen. Railway terminates TLS for both hosts, so
    # redirecting at the app keeps a valid certificate on the way through.
    if ($host = "www.mauzohalisi.com") {
        return 301 https://mauzohalisi.com$request_uri;
    }

    # ── Caching ──────────────────────────────────────────────────────────────
    # Nothing set Cache-Control before, so browsers fell back to heuristic
    # caching and held on to index.html and sw.js. A stale index.html keeps
    # asking for the previous bundle filename, so a deploy could go out and
    # never reach anyone — and a cached sw.js meant the new service worker was
    # never registered, which is why skipWaiting and autoUpdate did not help.

    # Filenames carry a content hash, so a change is a new URL. Safe to keep
    # for a year, and never revalidated.
    # No `expires` directive here — it emits its own Cache-Control and would
    # send the header twice alongside add_header.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # These keep their names across deploys, so they must be revalidated every
    # time. "no-cache" still allows a 304 — it forbids using a copy unchecked.
    location = /index.html      { add_header Cache-Control "no-cache"; }
    location = /sw.js           { add_header Cache-Control "no-cache"; }
    location = /registerSW.js   { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # Digital Asset Links. Chrome fetches this to confirm that com.mauzohalisi.app
    # is allowed to render this origin without a URL bar. It must return JSON,
    # so it is declared before the SPA fallback: try_files would otherwise hand
    # back index.html for it and the Android app would silently fall back to a
    # browser tab with an address bar showing. Not cached, because the
    # fingerprint changes when the signing key does.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # The SPA fallback returns index.html under other paths too, so the same
        # rule has to apply here or a deep link reintroduces a stale shell.
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
